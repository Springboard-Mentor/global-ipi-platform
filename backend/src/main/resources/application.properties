spring.application.name=backend
server.port=5001

# Database Connection
# Replace 'your_db_name', 'your_username', and 'your_password' with actual local DB creds
spring.datasource.url=jdbc:postgresql://localhost:5432/ip_platform
spring.datasource.username=your db name
spring.datasource.password=your password

# Automatically create tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# File Upload Limits (Optional but recommended)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==============================================================
# MILESTONE 2: DATA SOURCE SWITCH
# Options: 'local' (Database) or 'external' (Government API)
# ==============================================================
#app.data.source=external
#app.data.source=wipo
# SWITCH: 'local' for Database, 'external' for NASA API
app.data.source=external

# Free Government API (USPTO / PatentsView)
api.patentsview.url=https://api.patentsview.org/patents/query

# SMTP Server Settings
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your email
spring.mail.password=your key
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true