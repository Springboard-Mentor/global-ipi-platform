spring.application.name=backend
server.port=5001

# DATABASE CONNECTION (Replace with your own credentials)
spring.datasource.url=jdbc:postgresql://localhost:5432/ip_platform
spring.datasource.username=postgres
spring.datasource.password=YOUR_DB_PASSWORD_HERE

# HIBERNATE SETTINGS
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# MILESTONE 2: SERPAPI INTEGRATION
app.data.source=external
app.serpapi.key=YOUR_SERPAPI_KEY_HERE