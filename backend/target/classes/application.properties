spring.application.name=backend
server.port=5001

# ==========================================
# 1. DATABASE CONNECTION
# ==========================================
spring.datasource.url=jdbc:postgresql://localhost:5432/ip_platform
spring.datasource.username=your datbase name
spring.datasource.password=

# ==========================================
# 2. HIBERNATE SETTINGS
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# 3. EXTERNAL API (SerpApi)
# ==========================================
app.data.source=external
# This key is read by ExternalIPService.java
app.serpapi.key=your api key

# ==========================================
# 4. EMAIL SETTINGS (Gmail SMTP)
# ==========================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.mail.username=your mail
spring.mail.password=your password

# ==========================================
# 5. PRODUCTION CONFIGURATION (Async, Scheduler & CORS)
# ==========================================

# Async Thread Pool Settings
app.async.core-pool-size=10
app.async.max-pool-size=50
app.async.queue-capacity=1000

# Scheduler Settings
app.scheduling.enabled=true

# ✅ FIXED: Renamed from 'app.cors.allowed-origins' to 'cors.allowed-origins'
cors.allowed-origins=http://localhost:5173,http://localhost:3000
# application.properties
gemini.api.key=your key 
ai.rate.limit.per.hour=80
ai.max.query.length=500

spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=5m